<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SDG 7 Erklärvideo</title>
<style>
@font-face{font-family:Nunito;font-weight:600;src:url(fonts/nunito-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Nunito;font-weight:800;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Nunito;font-weight:900;src:url(fonts/nunito-latin-900-normal.woff2) format('woff2')}
html,body{margin:0;background:#111;overflow:hidden}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;font-family:Nunito,sans-serif}
#svg{position:absolute;inset:0}
#cap{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);max-width:1040px;text-align:center;
  font:800 27px/1.3 Nunito,sans-serif;color:#FBF6EC;background:rgba(38,44,59,.82);padding:10px 24px;border-radius:18px;
  transition:none;white-space:normal}
#controls{position:absolute;top:730px;left:0;color:#ccc;font:14px sans-serif}
</style>
</head>
<body>
<div id="stage">
  <svg id="svg" viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="cap"></div>
</div>
<script>
// ======================================================================
//  SDG 7 – Erklärvideo. Jedes Bild wird aus der Zeit t (Sekunden) berechnet.
// ======================================================================
const DUR = 170;
const O = '#2d3142';
const C = {cream:'#EFE8D8', stripe:'#E7DFCC', teal:'#5E9C98', tealD:'#4A807C', navy:'#2F3E4C', skin:'#F3E3C6',
  brown:'#6B4038', sage:'#8FAE8B', sageD:'#6F8F6B', peach:'#E8B795', yellow:'#FCC30B', mustard:'#D9A93A',
  night:'#262C3B', grey:'#8A8F99', red:'#D2695C', white:'#FBF6EC', wood:'#C9A27E', woodD:'#A9825F', blue:'#6F93A8', green:'#6FA86A'};
const SDG = ['#E5243B','#DDA63A','#4C9F38','#C5192D','#FF3A21','#26BDE2','#FCC30B','#A21942','#FD6925','#DD1367','#FD9D24','#BF8B2E','#3F7E44','#0A97D9','#56C02B','#00689D','#19486A'];

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eio=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const eout=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(t,a,d=.55)=>back(P(t,a,a+d));
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const rad=a=>a*Math.PI/180;
const f=n=>Math.round(n*10)/10;

// ---------- Grundformen ----------
function tube(pts,col,w=22){
  const s=pts.map(q=>f(q[0])+','+f(q[1])).join(' ');
  return `<polyline points="${s}" fill="none" stroke="${O}" stroke-width="${w+6}" stroke-linecap="round" stroke-linejoin="round"/>`+
         `<polyline points="${s}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function stripes(c1=C.cream,c2=C.stripe,y0=0,y1=720){
  let s=`<rect x="0" y="${y0}" width="1280" height="${y1-y0}" fill="${c1}"/>`;
  for(let x=20;x<1280;x+=72) s+=`<rect x="${x}" y="${y0}" width="34" height="${y1-y0}" fill="${c2}"/>`;
  return s;
}
function txt(x,y,s,size=30,col=O,w=800,anchor='middle',extra=''){
  return `<text x="${x}" y="${y}" font-family="Nunito" font-weight="${w}" font-size="${size}" fill="${col}" text-anchor="${anchor}" ${extra}>${s}</text>`;
}
function G(inner,tf='',op=1){return `<g transform="${tf}" opacity="${f(clamp(op))}">${inner}</g>`}
function scaleAt(x,y,s){return `translate(${f(x)},${f(y)}) scale(${s.toFixed(4)}) translate(${-x},${-y})`}

// ---------- Figur (weiche, runde Variante des Referenz-Stils) ----------
function person(o){
  const d=Object.assign({x:0,y:0,s:1,shirt:C.teal,pants:C.navy,hair:C.navy,skin:C.skin,style:'short',
    armL:[12,-8],armR:[12,-8],blink:0,mouth:'smile',look:0,lookY:0,brow:0,walk:null,extra:'',front:'',bob:0,tie:null},o);
  const r=rad;
  function arm(side,[a1,a2]){
    const sx=side*48, sy=-186, L=54;
    const ex=sx+side*Math.sin(r(a1))*L, ey=sy+Math.cos(r(a1))*L;
    const hx=ex+side*Math.sin(r(a1+a2))*L, hy=ey+Math.cos(r(a1+a2))*L;
    return tube([[sx,sy],[ex,ey],[hx,hy]],d.shirt,22)+`<circle cx="${f(hx)}" cy="${f(hy)}" r="12" fill="${d.skin}" stroke="${O}" stroke-width="3"/>`;
  }
  let legA=0; if(d.walk!==null) legA=Math.sin(d.walk)*22;
  function leg(side,a){
    const hx=side*22, hy=-84, L=74;
    const fx=hx+Math.sin(r(a))*L, fy=hy+Math.cos(r(a))*L;
    return tube([[hx,hy],[fx,fy]],d.pants,26)+`<ellipse cx="${f(fx+side*4)}" cy="${f(fy+4)}" rx="21" ry="10" fill="${O}"/>`;
  }
  let s='';
  s+=leg(-1,legA)+leg(1,-legA);
  // Haare hinten
  if(d.style==='bun') s+=`<circle cx="-60" cy="-236" r="22" fill="${d.hair}" stroke="${O}" stroke-width="3"/>`;
  if(d.style==='long') s+=`<rect x="-70" y="-300" width="140" height="120" rx="34" fill="${d.hair}" stroke="${O}" stroke-width="3"/>`;
  // Oberkörper
  s+=`<rect x="-52" y="-204" width="104" height="130" rx="36" fill="${d.shirt}" stroke="${O}" stroke-width="3"/>`;
  s+=`<path d="M-16 -203 L0 -186 L16 -203" fill="none" stroke="${O}" stroke-width="3" stroke-linejoin="round"/>`;
  if(d.tie) s+=`<path d="M0 -186 l-6 8 l6 26 l6 -26 z" fill="${d.tie}" stroke="${O}" stroke-width="2"/>`;
  s+=d.front;
  s+=arm(-1,d.armL)+arm(1,d.armR);
  // Hals + Kopf
  s+=`<rect x="-12" y="-214" width="24" height="16" fill="${d.skin}" stroke="${O}" stroke-width="3"/>`;
  s+=`<circle cx="-64" cy="-254" r="12" fill="${d.skin}" stroke="${O}" stroke-width="3"/><circle cx="64" cy="-254" r="12" fill="${d.skin}" stroke="${O}" stroke-width="3"/>`;
  s+=`<rect x="-64" y="-320" width="128" height="114" rx="48" fill="${d.skin}"/>`;
  // Haarkappe
  if(d.style==='short') s+=`<path d="M-64 -258 L-64 -274 Q-64 -320 -16 -320 L16 -320 Q64 -320 64 -274 L64 -262 Q56 -290 22 -290 Q2 -282 -18 -294 Q-50 -292 -64 -258 Z" fill="${d.hair}"/>`;
  else s+=`<path d="M-64 -250 L-64 -274 Q-64 -320 -16 -320 L16 -320 Q64 -320 64 -274 L64 -250 Q58 -282 34 -290 Q6 -298 -8 -286 Q-30 -296 -50 -284 Q-62 -270 -64 -250 Z" fill="${d.hair}"/>`;
  s+=`<rect x="-64" y="-320" width="128" height="114" rx="48" fill="none" stroke="${O}" stroke-width="3"/>`;
  if(d.style==='bun') s+=`<circle cx="34" cy="-292" r="6" fill="${C.white}" stroke="${O}" stroke-width="1.5"/><circle cx="44" cy="-287" r="5" fill="${C.peach}" stroke="${O}" stroke-width="1.5"/>`;
  // Gesicht
  const ey=-250+d.lookY*3, bl=d.blink?1.2:11;
  for(const sd of [-1,1]){
    const cx=sd*25;
    s+=`<ellipse cx="${cx}" cy="${ey}" rx="13" ry="${bl}" fill="${C.white}" stroke="${O}" stroke-width="2.2"/>`;
    if(!d.blink) s+=`<circle cx="${f(cx+d.look*4)}" cy="${f(ey+d.lookY*2)}" r="5.6" fill="${O}"/>`;
    const inner=-272-d.brow*5, outer=-272+d.brow*1;
    s+=`<path d="M${sd*14} ${inner} L${sd*36} ${outer}" stroke="${O}" stroke-width="3.2" stroke-linecap="round"/>`;
  }
  s+=`<path d="M3 -244 l-6 9 l6 2" fill="none" stroke="#9b8b7a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
  const m={smile:'M-14 -222 Q0 -211 14 -222',big:'M-16 -224 Q0 -204 16 -224 Z',flat:'M-12 -219 L12 -219',sad:'M-13 -215 Q0 -225 13 -215',o:''}[d.mouth];
  if(d.mouth==='o') s+=`<ellipse cx="0" cy="-219" rx="6" ry="8" fill="${O}"/>`;
  else if(d.mouth==='big') s+=`<path d="${m}" fill="${O}" stroke="${O}" stroke-width="2.6" stroke-linejoin="round"/>`;
  else s+=`<path d="${m}" fill="none" stroke="${O}" stroke-width="3" stroke-linecap="round"/>`;
  s+=d.extra;
  return `<g transform="translate(${f(d.x)},${f(d.y+d.bob)}) scale(${d.s})">${s}</g>`;
}
const blinkAt=(t,seed=0)=>((t+seed*1.7)%3.7)<0.12;

// ---------- Weltkugel ----------
function globe(cx,cy,r,t,id,tint=0){
  const off=(t*18)%400;
  let land='';
  for(const k of [0,400]){
    const x=cx-r-off+k;
    land+=`<g transform="translate(${f(x)},${cy-r})">`+
      `<path d="M20 70 q30 -40 70 -20 q30 10 20 50 q-10 40 -40 50 q-30 0 -40 -30 q-20 -20 -10 -50z" fill="${C.sage}"/>`+
      `<path d="M150 40 q40 -20 80 10 q20 30 -10 50 q-20 20 -10 60 q0 40 -30 50 q-30 -20 -20 -70 q-30 -20 -10 -100z" fill="${C.sage}"/>`+
      `<path d="M270 150 q30 -10 50 20 q10 30 -20 40 q-30 0 -30 -60z" fill="${C.sage}"/>`+
      `<path d="M300 40 q40 0 60 30 q0 30 -40 30 q-30 -20 -20 -60z" fill="${C.sage}"/>`+
      `<path d="M60 190 q30 0 40 30 q-10 40 -30 50 q-20 -30 -10 -80z" fill="${C.sage}"/>`+
      `</g>`;
  }
  return `<defs><clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs>`+
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.blue}"/>`+
    `<g clip-path="url(#${id})">${land}<circle cx="${cx}" cy="${cy}" r="${r}" fill="#C8553D" opacity="${f(tint*0.45)}"/>`+
    `<path d="M${cx-r} ${cy-r*0.2} a${r} ${r} 0 0 0 ${2*r} 0 v${r*1.3} h${-2*r}z" fill="#000" opacity=".08"/></g>`+
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${O}" stroke-width="3"/>`+
    `<path d="M${cx-r*0.55} ${cy-r*0.62} q${r*0.25} ${-r*0.18} ${r*0.5} ${-r*0.16}" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".45"/>`;
}

// ---------- SDG-7-Kachel (eigene, vereinfachte Darstellung) ----------
function sdgTile(t,t0,size=300){
  const k=size/300;
  const draw=P(t,t0+0.4,t0+1.6);
  const typ=P(t,t0+0.9,t0+2.2);
  const l1='BEZAHLBARE UND', l2='SAUBERE ENERGIE';
  const n=Math.round(typ*(l1.length+l2.length));
  const s1=l1.slice(0,Math.min(n,l1.length)), s2=l2.slice(0,Math.max(0,n-l1.length));
  let rays='';
  const rot=t*12;
  for(let i=0;i<12;i++){
    const a=rad(i*30+rot), on=draw>i/12;
    if(!on) continue;
    rays+=`<line x1="${f(150+Math.cos(a)*62)}" y1="${f(200+Math.sin(a)*62)}" x2="${f(150+Math.cos(a)*80)}" y2="${f(200+Math.sin(a)*80)}" stroke="#fff" stroke-width="9" stroke-linecap="round"/>`;
  }
  const circ=2*Math.PI*44*0.84;
  return `<g transform="scale(${k})">`+
    `<rect x="0" y="0" width="300" height="300" rx="34" fill="${C.yellow}" stroke="${O}" stroke-width="3"/>`+
    txt(24,110,'7',118,'#fff',900,'start')+
    txt(100,52,s1,19,'#fff',900,'start')+txt(100,78,s2,19,'#fff',900,'start')+
    rays+
    `<circle cx="150" cy="200" r="44" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="${f(circ*draw)} 999" transform="rotate(-60 150 200)"/>`+
    `<line x1="150" y1="168" x2="150" y2="${f(168+34*draw)}" stroke="#fff" stroke-width="10" stroke-linecap="round"/>`+
    `</g>`;
}

// ---------- Stadt ----------
const BUILD=[[30,150,250],[190,120,330],[320,160,210],[490,110,380],[610,150,270],[770,120,350],[900,170,230],[1080,170,300]];
function city(t,litFn,dark=false){
  let s='';
  BUILD.forEach(([x,w,h],bi)=>{
    const top=600-h, col=['#3A4256','#424B61','#353C4E'][bi%3];
    s+=`<rect x="${x}" y="${top}" width="${w}" height="${h+20}" rx="16" fill="${col}" stroke="${O}" stroke-width="3"/>`;
    let wi=0;
    for(let yy=top+26; yy<580; yy+=44){
      for(let xx=x+20; xx<x+w-30; xx+=34){
        const id=bi*100+wi++;
        const lit=litFn(id);
        s+=`<rect x="${xx}" y="${yy}" width="20" height="26" rx="6" fill="${lit>0?'#F6D77A':'#2A3040'}" opacity="${lit>0?f(0.35+0.65*lit):1}"/>`;
      }
    }
  });
  s+=`<rect x="0" y="600" width="1280" height="120" fill="#20242F"/>`;
  return s;
}

// ======================================================================
//  SZENEN
// ======================================================================

// 0:00–0:05 Handy wird geladen
function sPhone(t){
  const lt=t; const z=1+0.04*P(t,0,5);
  const charge=lerp(0.18,1,eio(P(t,0.6,4.2)));
  const bc=charge<0.4?C.red:(charge<0.75?C.mustard:C.green);
  let s=stripes()+`<rect x="0" y="520" width="1280" height="200" fill="${C.wood}" stroke="${O}" stroke-width="3"/><rect x="0" y="545" width="1280" height="10" fill="${C.woodD}"/>`;
  // Steckdose
  s+=`<rect x="960" y="330" width="110" height="110" rx="26" fill="${C.white}" stroke="${O}" stroke-width="3"/><circle cx="1015" cy="385" r="34" fill="#E9E2D2" stroke="${O}" stroke-width="2"/>`;
  s+=`<rect x="992" y="368" width="46" height="34" rx="10" fill="#DDD5C2" stroke="${O}" stroke-width="3"/>`;
  // Kabel
  s+=`<path d="M1015 402 C1015 520 760 560 680 520" fill="none" stroke="${O}" stroke-width="10" stroke-linecap="round"/><path d="M1015 402 C1015 520 760 560 680 520" fill="none" stroke="#F4EFE3" stroke-width="5" stroke-linecap="round"/>`;
  // Handy auf Ständer
  s+=`<path d="M560 520 l30 -30 h140 l30 30z" fill="${C.navy}" stroke="${O}" stroke-width="3"/>`;
  s+=`<rect x="570" y="200" width="180" height="310" rx="30" fill="${C.navy}" stroke="${O}" stroke-width="3"/><rect x="584" y="216" width="152" height="278" rx="20" fill="#3E5368"/>`;
  s+=`<rect x="630" y="226" width="60" height="8" rx="4" fill="${C.navy}"/>`;
  // Akku
  s+=`<rect x="610" y="300" width="96" height="150" rx="18" fill="none" stroke="#fff" stroke-width="6"/><rect x="640" y="288" width="36" height="12" rx="4" fill="#fff"/>`;
  const fh=134*charge;
  s+=`<rect x="618" y="${f(442-fh)}" width="80" height="${f(fh)}" rx="11" fill="${bc}"/>`;
  s+=`<path d="M664 330 l-22 46 h18 l-8 40 l28 -52 h-18 l10 -34z" fill="#fff" stroke="${O}" stroke-width="2" stroke-linejoin="round" opacity="${0.6+0.4*Math.sin(t*6)}"/>`;
  s+=txt(658,480,Math.round(charge*100)+' %',26,'#fff',900);
  // Figur
  s+=person({x:300,y:600,s:0.95,shirt:C.peach,hair:C.brown,style:'bun',look:1.6,blink:blinkAt(t,1),
    armR:[30,-60],armL:[10,-6],mouth:charge>0.9?'big':'smile',bob:Math.sin(t*3)*2});
  return G(s,scaleAt(640,400,z));
}

// 0:05–0:10 Zug fährt vorbei
function sTrain(t){
  const lt=t-5;
  let s=`<rect width="1280" height="720" fill="#E9E1CC"/>`;
  s+=`<circle cx="1000" cy="170" r="70" fill="${C.peach}" opacity=".9"/>`;
  // Wolken
  for(let i=0;i<3;i++){const cx=((200+i*420)-lt*20)%1400; s+=`<g opacity=".9"><ellipse cx="${f(cx)}" cy="${120+i*30}" rx="70" ry="24" fill="#F6F1E4"/><ellipse cx="${f(cx+40)}" cy="${105+i*30}" rx="40" ry="24" fill="#F6F1E4"/></g>`;}
  s+=`<path d="M0 420 Q200 330 420 400 T860 380 T1280 400 V720 H0z" fill="${C.sage}" stroke="${O}" stroke-width="3"/>`;
  s+=`<path d="M0 480 Q260 430 520 470 T1280 460 V720 H0z" fill="${C.sageD}" stroke="${O}" stroke-width="3"/>`;
  // Oberleitung
  s+=`<line x1="0" y1="300" x2="1280" y2="300" stroke="${O}" stroke-width="3"/>`;
  for(let i=0;i<4;i++){const px=((i*380)-lt*60)%1520+80; s+=`<rect x="${f(px)}" y="290" width="12" height="290" fill="${C.navy}" stroke="${O}" stroke-width="2"/><rect x="${f(px-30)}" y="290" width="50" height="10" fill="${C.navy}"/>`;}
  s+=`<rect x="0" y="575" width="1280" height="16" fill="${C.navy}"/><rect x="0" y="591" width="1280" height="130" fill="#B9A98C" stroke="${O}" stroke-width="3"/>`;
  for(let x=-40;x<1320;x+=46){s+=`<rect x="${f(x-((lt*600)%46))}" y="591" width="20" height="10" fill="#8F7F66"/>`;}
  // Zug
  const tx=lerp(1350,-1750,eio(P(lt,0.3,4.6)));
  let tr='';
  for(let c=0;c<3;c++){
    const x=tx+c*330;
    const nose=c===0;
    tr+= nose ? `<path d="M${x+60} 420 h260 v150 h-310 q-20 0 -20 -24 q0 -70 70 -126z" fill="${C.teal}" stroke="${O}" stroke-width="3"/>`
              : `<rect x="${x}" y="420" width="320" height="150" rx="26" fill="${C.teal}" stroke="${O}" stroke-width="3"/>`;
    tr+=`<rect x="${x+(nose?60:20)}" y="440" width="${nose?240:280}" height="54" rx="16" fill="${C.white}" stroke="${O}" stroke-width="3"/>`;
    for(let wv=0; wv<(nose?3:4); wv++){const wx=x+(nose?110:40)+wv*66; tr+=`<line x1="${wx+40}" y1="442" x2="${wx+40}" y2="492" stroke="${O}" stroke-width="3"/>`;
      tr+=`<circle cx="${wx+12}" cy="470" r="12" fill="${['#6B4038','#2F3E4C','#D9A93A'][(wv+c)%3]}"/>`;}
    tr+=`<rect x="${x}" y="520" width="320" height="12" fill="${C.tealD}"/>`;
    for(const wx of [50,110,210,270]) tr+=`<circle cx="${x+wx}" cy="572" r="16" fill="${O}"/><circle cx="${x+wx}" cy="572" r="6" fill="${C.grey}"/>`;
  }
  // Stromabnehmer
  tr+=`<path d="M${tx+150} 420 l40 -60 l-40 -60 M${tx+120} 300 h80" fill="none" stroke="${O}" stroke-width="5" stroke-linejoin="round"/>`;
  if(Math.sin(lt*40)>0.3) tr+=`<path d="M${tx+160} 296 l10 -14 l4 10 l10 -12" stroke="${C.yellow}" stroke-width="4" fill="none"/>`;
  // Speed-Linien
  for(let i=0;i<5;i++) tr+=`<line x1="${tx+1000+i*20}" y1="${440+i*25}" x2="${tx+1100+i*40}" y2="${440+i*25}" stroke="${O}" stroke-width="3" stroke-linecap="round" opacity=".35"/>`;
  s+=tr;
  return s;
}

// 0:10–0:15 Stadtlichter gehen an
function sCity(t){
  const lt=t-10;
  let s=`<rect width="1280" height="720" fill="${C.night}"/>`;
  for(let i=0;i<60;i++){const tw=0.4+0.6*Math.abs(Math.sin(t*2+i)); s+=`<circle cx="${f(rnd(i)*1280)}" cy="${f(rnd(i+99)*300)}" r="${f(1+rnd(i+7)*2)}" fill="#F6EFD9" opacity="${f(tw)}"/>`;}
  s+=`<circle cx="1100" cy="110" r="44" fill="#F3E7C4"/><circle cx="1122" cy="96" r="40" fill="${C.night}"/>`;
  s+=city(t,id=>clamp((lt-0.3-rnd(id)*3.8)/0.25));
  for(let i=0;i<6;i++){const x=100+i*220,on=lt>1+i*0.5;
    s+=`<rect x="${x}" y="560" width="8" height="70" fill="${C.navy}"/><circle cx="${x+4}" cy="556" r="12" fill="${on?'#F6D77A':'#4A5163'}" stroke="${O}" stroke-width="2"/>`;
    if(on) s+=`<circle cx="${x+4}" cy="556" r="40" fill="#F6D77A" opacity=".18"/>`;}
  return G(s,scaleAt(640,360,1.06-0.06*P(lt,0,5)));
}

// 0:15–0:20 Blackout – nur eine Kerze
function sBlackout(t){
  const lt=t-15;
  let s=`<rect width="1280" height="720" fill="${C.night}"/>`;
  const off=lt>0.9;
  if(lt<1.6){
    const flick=lt<0.9?(lt>0.45&&Math.sin(lt*70)>0?0.15:1):0;
    let c=city(t,id=>flick);
    s+=G(c,'',1);
  }
  s+=`<rect width="1280" height="720" fill="#0E1016" opacity="${f(P(lt,0.9,1.0)*0.85+P(lt,1.3,2.0)*0.15)}"/>`;
  // Kerze
  const ca=P(lt,2.0,3.0);
  if(ca>0){
    const fl=1+0.08*Math.sin(t*23)+0.05*Math.sin(t*37), sw=3*Math.sin(t*9);

// 2:30–2:44 Call to Action im Zimmer
function sRoom(t){
  const lt=t-150;
  const lightOff=P(t,152.6,152.8);
  // Position der Figur
  const stops=[[150,380],[153.6,380],[154.6,590],[158.4,590],[159.4,1000]];
  let px=stops[0][1], walking=false;
  for(let i=0;i<stops.length-1;i++){const [a,xa]=stops[i],[b,xb]=stops[i+1]; if(t>=a&&t<b){px=lerp(xa,xb,eio(P(t,a,b))); walking=xa!==xb;} if(t>=b) px=xb;}
  let s=stripes('#EDE3CF','#E4D9C2',0,560)+`<rect x="0" y="560" width="1280" height="160" fill="${C.wood}" stroke="${O}" stroke-width="3"/>`;
  for(let x=0;x<1280;x+=160) s+=`<line x1="${x}" y1="560" x2="${x-60}" y2="720" stroke="${C.woodD}" stroke-width="3"/>`;
  // Fenster
  s+=`<rect x="60" y="130" width="170" height="220" rx="18" fill="#CFE0DD" stroke="${O}" stroke-width="3"/><line x1="145" y1="130" x2="145" y2="350" stroke="${O}" stroke-width="3"/><line x1="60" y1="240" x2="230" y2="240" stroke="${O}" stroke-width="3"/><circle cx="190" cy="180" r="20" fill="${C.yellow}" opacity=".8"/>`;
  // Lampe
  s+=`<line x1="560" y1="0" x2="560" y2="110" stroke="${O}" stroke-width="3"/><path d="M510 150 Q510 110 560 110 Q610 110 610 150z" fill="${C.teal}" stroke="${O}" stroke-width="3"/>`;
  s+=`<circle cx="560" cy="156" r="14" fill="${lightOff?'#CFC7B5':'#FBE7A1'}" stroke="${O}" stroke-width="2"/>`;
  if(lightOff<1) s+=`<path d="M520 160 L380 560 H740 L600 160z" fill="#F6D77A" opacity="${f(0.22*(1-lightOff))}"/>`;
  // Lichtschalter
  s+=`<rect x="210" y="400" width="50" height="70" rx="12" fill="${C.white}" stroke="${O}" stroke-width="3"/><rect x="224" y="${lightOff?436:414}" width="22" height="20" rx="5" fill="${C.grey}" stroke="${O}" stroke-width="2"/>`;
  // Heizung + Thermostat
  const heat=1-eio(P(t,156.2,157.4))*0.5;
  s+=`<rect x="780" y="420" width="240" height="120" rx="16" fill="${C.white}" stroke="${O}" stroke-width="3"/>`;
  for(let i=1;i<6;i++) s+=`<line x1="${780+i*40}" y1="430" x2="${780+i*40}" y2="530" stroke="${O}" stroke-width="3"/>`;
  for(let i=0;i<3;i++){const a=(t*0.7+i/3)%1; s+=`<path d="M${820+i*80} ${f(410-a*80)} q12 -14 0 -28 q-12 -14 0 -28" stroke="${C.red}" stroke-width="5" fill="none" stroke-linecap="round" opacity="${f((1-a)*0.7*heat*heat)}"/>`;}
  const dial=lerp(0,-70,eio(P(t,156,157.4)));
  s+=`<g transform="translate(735,470)"><circle r="30" fill="${C.white}" stroke="${O}" stroke-width="3"/><g transform="rotate(${f(dial)})"><line x1="0" y1="0" x2="0" y2="-22" stroke="${C.red}" stroke-width="5" stroke-linecap="round"/></g>${txt(0,52,t<156.8?'5':'3',22,O,900)}</g>`;
  // Schreibtisch + Laptop
  s+=`<rect x="1060" y="400" width="210" height="18" rx="6" fill="${C.woodD}" stroke="${O}" stroke-width="3"/><rect x="1080" y="418" width="14" height="142" fill="${C.woodD}"/><rect x="1236" y="418" width="14" height="142" fill="${C.woodD}"/>`;
  const tog=eio(P(t,161,161.6));
  s+=`<g transform="translate(1165,400)"><path d="M-80 0 L-70 -110 H70 L80 0z" fill="${C.navy}" stroke="${O}" stroke-width="3" stroke-linejoin="round"/><rect x="-62" y="-102" width="124" height="94" rx="6" fill="#EAF1EE"/>`+
    txt(0,-80,'Ökostrom',18,O,900)+
    `<rect x="-30" y="-64" width="60" height="30" rx="15" fill="${tog>0.5?C.green:'#BDB6A8'}" stroke="${O}" stroke-width="2"/><circle cx="${f(-15+30*tog)}" cy="-49" r="12" fill="#fff" stroke="${O}" stroke-width="2"/>`+
    G(`<path d="M0 0 C-14 -6 -16 -24 0 -36 C16 -24 14 -6 0 0z" fill="${C.green}" stroke="${O}" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="-26" stroke="${O}" stroke-width="2"/>`,`translate(0,-10) scale(${pop(t,161.8,0.4).toFixed(3)})`)+`</g>`;
  // Figur – Armhaltung je nach Aktion
  let armL=[12,-8], armR=[12,-8], look=0, mouth='smile';
  if(t<154){ armL = t>151.6? [lerp(12,110,eio(P(t,151.6,152.4))), lerp(-8,-10,P(t,151.6,152.4))] : [12,-8]; look=-1.5; if(t>153.2) armL=[lerp(110,12,eio(P(t,153.2,153.6))),-8]; }
  else if(t>154.6&&t<158.4){ armR=[lerp(12,85,eio(P(t,155,155.8))),-10-6*Math.sin(t*6)*P(t,156,157.4)]; if(t>157.8) armR=[lerp(85,12,eio(P(t,157.8,158.3))),-8]; look=1.5; }
  else if(t>159.4){ armR=[lerp(12,135,eio(P(t,159.8,160.6))),lerp(-8,-30,P(t,159.8,160.6))]; look=1.5; mouth=t>161.6?'big':'smile'; }
  const wk=walking?(t*12):null;
  s+=person({x:px,y:640,s:0.95,shirt:C.teal,hair:C.navy,armL,armR,look,mouth,walk:wk,blink:blinkAt(t,10),bob:walking?-Math.abs(Math.sin(t*12))*6:0});
  // Abdunkeln, wenn Licht aus
  s+=`<rect width="1280" height="720" fill="#2B3040" opacity="${f(lightOff*0.12)}"/>`;

  const bdg=(x,y,tt)=>{const k=pop(t,tt,0.45); return G(`<circle r="26" fill="${C.green}" stroke="${O}" stroke-width="3"/><path d="M-11 1 l7 9 l15 -18" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,`translate(${x},${y}) scale(${k.toFixed(3)})`);};
  s+=bdg(290,380,153)+bdg(770,400,157.6)+bdg(1250,250,162.2);

// ---------- Hauptfunktion ----------
function scene(t){
  if(t<5) return sPhone(t);
  if(t<10) return sTrain(t);
  if(t<15) return sCity(t);
  if(t<20) return sBlackout(t);
  if(t<45) return sIntro(t);
  if(t<60) return sCoal(t);
  if(t<67) return sPrice(t);
  if(t<75) return sQuestion(t);
  if(t<120) return sGoals(t);
  if(t<150) return sWhy(t);
  if(t<164) return sRoom(t);
  return sOutro(t);
}
function renderFrame(t){
  let s=scene(t);
  // Blenden zwischen Abschnitten
  let fade=0;
  for(const b of [45,60,67,75,120,150,164]) fade=Math.max(fade,1-Math.abs(t-b)/0.35);
  if(fade>0) s+=`<rect width="1280" height="720" fill="${C.cream}" opacity="${f(fade)}"/>`;
  // kurze Weiß-Blitze bei den schnellen Schnitten
  for(const b of [5,10]){const k=1-Math.abs(t-b)/0.12; if(k>0) s+=`<rect width="1280" height="720" fill="#fff" opacity="${f(k*0.7)}"/>`;}
  const fi=1-P(t,20,21); if(t>=20&&fi>0) s+=`<rect width="1280" height="720" fill="#0E1016" opacity="${f(fi)}"/>`;
  const fo=P(t,168.8,170); if(fo>0) s+=`<rect width="1280" height="720" fill="#000" opacity="${f(fo)}"/>`;
  const fs=1-P(t,0,0.4); if(fs>0) s+=`<rect width="1280" height="720" fill="#000" opacity="${f(fs)}"/>`;
  document.getElementById('svg').innerHTML=s;
  const cap=document.getElementById('cap');
  const c=CAPS.find(c=>t>=c[0]&&t<c[1]);
  if(c && !window.NOCAPS){cap.style.display='block'; if(cap.textContent!==c[2]) cap.textContent=c[2]; cap.style.opacity=Math.min(1,(t-c[0])/0.25,(c[1]-t)/0.25);}
  else cap.style.display='none';
}
window.renderFrame=renderFrame;

// ---------- Vorschau im Browser ----------
if(!window.RENDER_MODE){
  const params=new URLSearchParams(location.search);
  let start=performance.now()-(parseFloat(params.get('t'))||0)*1000;
  const audio=new Audio('music.wav');
  document.addEventListener('click',()=>{start=performance.now(); audio.currentTime=0; audio.play().catch(()=>{});});
  (function loop(){const t=((performance.now()-start)/1000)%DUR; renderFrame(t); requestAnimationFrame(loop);})();
}
